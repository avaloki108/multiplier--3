[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
]

# Compiler settings
solc_version = "0.8.23"
optimizer = true
optimizer_runs = 200
via_ir = false

# Test settings
verbosity = 3
fuzz_runs = 256

# Formatter settings
[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

# Documentation settings
[doc]
out = "docs"
repository = "https://github.com/trailofbits/multiplier"
